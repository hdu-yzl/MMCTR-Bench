[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "mmctr-bench"
version = "0.1.0"
description = "A benchmark for multimodal click-through-rate recommendation models"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
    "numpy>=1.19.2,<1.24",
    "PyYAML>=6.0,<7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/hdu-yzl/MMCTR-Bench"

[project.scripts]
mmctr = "mmctr.cli:main"

[project.optional-dependencies]
training = [
    "scikit-learn>=1.0,<1.4",
    "torch>=1.13.1,<2.0",
]
data = [
    "h5py>=3.8,<3.11",
    "jax==0.4.13",
    "jaxlib==0.4.13; platform_machine == 'x86_64' and platform_system == 'Linux'",
    "lmdb>=1.3,<2",
    "pandas>=1.2,<2.1",
    "Pillow>=9,<11",
    "pyarrow>=8,<18",
    "tensorflow>=2.12.1,<2.13",
    "tqdm>=4.60,<5",
    "typing-extensions>=4.4,<4.6",
]
multimodal = [
    "Pillow>=9,<11",
    "sentence-transformers>=2.2,<3.3",
    "timm>=0.9,<1.1",
    "transformers>=4.30,<4.47",
]
analysis = [
    "matplotlib>=3.5,<3.8",
    "pandas>=1.2,<2.1",
    "psutil>=5.9,<8",
    "scipy>=1.7,<1.11",
]
tuning = [
    "optuna>=3.0,<4",
    "optuna-integration>=3.0,<4",
    "psutil>=5.9,<8",
    "ruamel.yaml>=0.17,<0.19",
]
dev = [
    "build>=1,<2",
    "mypy>=1.8,<1.11",
    "pytest>=7,<9",
    "pytest-cov>=4,<6",
    "ruff>=0.5,<0.9",
    "types-PyYAML>=6,<7",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py38"
include = ["src/mmctr/**/*.py", "tests/**/*.py"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mmctr"]
data_file = ".cache/coverage/.coverage"

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.8"
mypy_path = "src"
explicit_package_bases = true
follow_imports = "skip"
files = ["src/mmctr"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
