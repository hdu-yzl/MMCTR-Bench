# 模型配置
dnn:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [1024, 512, 256]
    dropout: 0.0
    batch_norm: true

    seq_pooling_method:  "mean" # mean, max, attention, sum

    modal_fusion_method: "cat"
    seq_modeling: false

dnn_seq:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    dropout: 0.0
    batch_norm: true

    seq_pooling_method: "mean" # mean, max, attention, sum

    modal_fusion_method: "cat"
    seq_modeling: true

dnn_mm:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [1024, 512, 256]
    dropout: 0.0
    batch_norm: true

    seq_pooling_method:  "mean" # mean, max, attention, sum

    modal_fusion_method: "cat"
    seq_modeling: false

dcn:
    latent_dim: 128  # embedding dimension
    projection_dim: 128
    cross_num: 3
    mlp_dims: [1024, 512, 256]
    dropout: 0.0
    batch_norm: true

    seq_pooling_method:  "mean" # mean, max, attention, sum

    seq_modeling: false


deepfm:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [1024, 512, 256]
    dropout: 0.0
    batch_norm: true

    seq_pooling_method:  "mean" # mean, max, attention, sum

    seq_modeling: false

din:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [1024, 512, 256]
    attention_mlp_dims: [64, 32]  # DIN 注意力激活单元维度
    dropout: 0.0
    batch_norm: true

    seq_pooling_method:  "din" # mean, max, attention, sum

    modal_fusion_method: "cat"
    seq_modeling: true

autoint:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [1024, 512, 256]
    dropout: 0.0
    batch_norm: true

    seq_pooling_method:  "mean" # mean, max, attention, sum

    seq_modeling: false

    attn_layers: 3        # 交互层数
    attn_heads: 2         # 注意力头数
    attn_size: 64         # 每个头的维度
    attn_use_residual: true

lmf:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    dropout: 0.0
    batch_norm: true

    seq_pooling_method: "mean" # mean, max, attention, sum

    seq_modeling: false

    rank: 5
    fusion_dim: 32

diff_msin:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    dropout: 0.0
    batch_norm: true

    seq_pooling_method: "mean" # mean, max, attention, sum

    modal_fusion_method: "cat"
    seq_modeling: true

    lambda1: 0.01
    lambda2: 0.01

    T : 5
    num_cross_layers: 3
    heads : 1

marn:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    dropout: 0.0
    batch_norm: true

    seq_pooling_method: "mean" # mean, max, attention, sum

    modal_fusion_method: "cat"
    seq_modeling: true

    lambda0: 0.05

mtfn:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    dropout: 0.0
    batch_norm: true

    seq_pooling_method: "mean" # mean, max, attention, sum

    modal_fusion_method: "cat"
    seq_modeling: false

    lambda0: 0.05

dmf:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    dropout: 0.0
    batch_norm: true

    modal_fusion_method: "cat"
    seq_modeling: true

    tier_num: 10
    attention_dim: 128
    num_buckets: 35
    alpha: 0.5

simcen:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    hidden_unit: [480,480,480]
    dropout: 0.0
    batch_norm: true

    modal_fusion_method: "cat"
    seq_pooling_method: "mean"
    seq_modeling: false

    cl_temperature: 0.1
    alpha: 0.5

    ego_dropout: 0.0
    v1_dropout: 0.0
    v2_dropout: 0.0

    ego_batch_norm: true
    v1_batch_norm: true
    v2_batch_norm: true

naml:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    dropout: 0.0
    batch_norm: true

    modal_fusion_method: "maf"
    seq_modeling: true

make:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    dropout: 0.0
    batch_norm: true

    modal_fusion_method: "cat"
    seq_modeling: true

    tier_num: 10

em3:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    dropout: 0.0
    batch_norm: true

    modal_fusion_method: "cat"
    seq_modeling: true

    query_num: 5
    cic_tau: 0.1
    cic_weight: 0.1

gmmf:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    dropout: 0.0
    batch_norm: true

    seq_modeling: true
    lambdas: {'image': 0.1, 'text': 0.1, 'audio': 0.1}
    N: 2
    lr_main: 1e-4
    lr_disc: 1e-5
    lr_gen: 1e-5

    l2: 1e-7

mb:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    dropout: 0.0
    batch_norm: true

    seq_pooling_method: "mean"
    seq_modeling: false

    sensitive_modal: "image"
    insensitive_modal: "text"
    mb_balance_weight: 0.1
    mb_sample_num: 30
    mb_adv_eps: 1.0
    mb_pgd_steps: 3
    mb_fusion_hidden_dim: 128

pamd:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    dropout: 0.0
    batch_norm: true

    seq_pooling_method: "mean"
    seq_modeling: false

    pamd_hidden_dim: 128
    pamd_aux_weight: 0.1
    pamd_layer_norm: true

mmmlp:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    dropout: 0.0
    batch_norm: true

    seq_modeling: true
    mixer_layers: 2
    feature_mixer_layers: 2
    fusion_mixer_layers: 2
    token_hidden_dim: 10
    channel_hidden_dim: 256

m3srec:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    dropout: 0.0
    batch_norm: true

    seq_modeling: true
    num_heads: 4
    num_experts: 4
    moe_hidden_dim: 512
    attn_ffn_dim: 512
    num_specific_layers: 1
    num_cross_layers: 1
    fusion_hidden_dim: 128

rq:
    n_levels: 3
    codebook_size: 1024
    dimension: 128
    random_state: 42
    n_init: 5
    max_iter: 20
    tol: 1e-4

    # 数据集特定参数（需与对应 qarm 的 codebook_size / n_levels 保持一致）
    antm2c:
        n_levels: 3
        codebook_size: 1024
        dimension: 128
        random_state: 42
        n_init: 5
        max_iter: 20
        tol: 1e-4

    microlens:
        n_levels: 3
        codebook_size: 1024
        dimension: 128
        random_state: 42
        n_init: 5
        max_iter: 20
        tol: 1e-4

    tiktok:
        n_levels: 3
        codebook_size: 1024
        dimension: 128
        random_state: 42
        n_init: 5
        max_iter: 20
        tol: 1e-4


qarm:
    latent_dim: 128  # embedding dimension
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    dropout: 0.0
    batch_norm: true
    seq_modeling: true

    cross_num: 3
    n_levels: 3
    codebook_size: 1024

    # 启用数据集特定的参数
    antm2c:
        latent_dim: 128  # embedding dimension
        projection_dim: 128

        mlp_dims: [ 1024, 512, 256 ]
        dropout: 0.0
        batch_norm: true
        seq_modeling: true

        cross_num: 3
        n_levels: 3
        codebook_size: 1024
    
    microlens:
        latent_dim: 128  # embedding dimension
        projection_dim: 128

        mlp_dims: [ 1024, 512, 256 ]
        dropout: 0.0
        batch_norm: true
        seq_modeling: true

        cross_num: 3
        n_levels: 3
        codebook_size: 1024
    
    tiktok:
        latent_dim: 128  # embedding dimension
        projection_dim: 128

        mlp_dims: [ 1024, 512, 256 ]
        dropout: 0.0
        batch_norm: true
        seq_modeling: true

        cross_num: 3
        n_levels: 3
        codebook_size: 1024

psrq:
    latent_dim: 128
    projection_dim: 128

    psrq_dims: [256,128]
    codebook_size: 256
    n_levels: 3

    dropout: 0.0
    batch_norm: true
    seq_modeling: true

    mu: 0.25
    quant_loss_weight: 1

    # 数据集特定参数（需与对应 mcca 的 psrq_dims / codebook_size / n_levels 保持一致）
    antm2c:
        latent_dim: 128
        projection_dim: 128

        psrq_dims: [256,128]
        codebook_size: 256
        n_levels: 3

        dropout: 0.0
        batch_norm: true
        seq_modeling: true

        mu: 0.25
        quant_loss_weight: 1

    microlens:
        latent_dim: 128
        projection_dim: 128

        psrq_dims: [256,128]
        codebook_size: 256
        n_levels: 3

        dropout: 0.0
        batch_norm: true
        seq_modeling: true

        mu: 0.25
        quant_loss_weight: 1

    tiktok:
        latent_dim: 128
        projection_dim: 128

        psrq_dims: [256,128]
        codebook_size: 256
        n_levels: 3

        dropout: 0.0
        batch_norm: true
        seq_modeling: true

        mu: 0.25
        quant_loss_weight: 1


mcca:
    latent_dim: 128
    projection_dim: 128

    mlp_dims: [ 1024, 512, 256 ]
    psrq_dims: [256,128 ]

    codebook_size: 256
    n_levels: 3
    dropout: 0.0
    batch_norm: true
    seq_modeling: true

    antm2c:
        latent_dim: 128
        projection_dim: 128

        mlp_dims: [ 1024, 512, 256 ]
        psrq_dims: [256,128 ]

        codebook_size: 256
        n_levels: 3
        dropout: 0.0
        batch_norm: true
        seq_modeling: true
    
    microlens:
        latent_dim: 128
        projection_dim: 128

        mlp_dims: [ 1024, 512, 256 ]
        psrq_dims: [256,128 ]

        codebook_size: 256
        n_levels: 3
        dropout: 0.0
        batch_norm: true
        seq_modeling: true

    tiktok:
        latent_dim: 128
        projection_dim: 128

        mlp_dims: [ 1024, 512, 256 ]
        psrq_dims: [256,128 ]

        codebook_size: 256
        n_levels: 3
        dropout: 0.0
        batch_norm: true
        seq_modeling: true
