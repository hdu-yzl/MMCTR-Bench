# Training defaults from the unified MMCTR-Bench protocol.
max_epochs: 20
lr: 1.0e-3
l2: 1.0e-7
batch_size: 512
optim: "Adam"
early_stop_patience: 5

# Run-local checkpoint and log paths are replaced by the training entry point.
checkpoint_dir: "outputs/checkpoints/"
# RQ/PSRQ pretraining artifacts are independent of recommendation runs.
quantization_artifact_dir: "outputs/quantization/artifacts/"
output_root: "outputs"
cuda: 1
log_dir: "outputs/logs/"
log_interval: 1000
seed: 2025
