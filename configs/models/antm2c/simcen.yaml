schema_version: 1
dataset: antm2c
model_name: simcen
model:
  latent_dim: 128
  projection_dim: 128
  mlp_dims:
  - 1024
  - 512
  - 256
  hidden_unit:
  - 480
  - 480
  - 480
  dropout: 0.0
  batch_norm: true
  modal_fusion_method: cat
  seq_pooling_method: mean
  seq_modeling: false
  cl_temperature: 0.1
  alpha: 0.5
  ego_dropout: 0.0
  v1_dropout: 0.0
  v2_dropout: 0.0
  ego_batch_norm: true
  v1_batch_norm: true
  v2_batch_norm: true
training:
  lr: 0.001
  l2: 1.0e-07
  batch_size: 512
  optim: adam
  max_epochs: 20
  early_stop_patience: 5
selection: {}
