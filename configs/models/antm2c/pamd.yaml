schema_version: 1
dataset: antm2c
model_name: pamd
model:
  latent_dim: 128
  projection_dim: 128
  mlp_dims:
  - 1024
  - 512
  - 256
  dropout: 0.0
  batch_norm: true
  seq_pooling_method: mean
  seq_modeling: false
  pamd_hidden_dim: 128
  pamd_aux_weight: 0.1
  pamd_layer_norm: true
training:
  lr: 0.001
  l2: 1.0e-07
  batch_size: 512
  optim: adam
  max_epochs: 20
  early_stop_patience: 5
selection: {}
