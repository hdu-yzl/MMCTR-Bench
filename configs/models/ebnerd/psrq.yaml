schema_version: 1
dataset: ebnerd
model_name: psrq
model:
  latent_dim: 16
  projection_dim: 128
  mlp_dims:
  - 1024
  - 512
  - 256
  psrq_dims:
  - 256
  - 128
  codebook_size: 256
  n_levels: 3
  dropout: 0.0
  batch_norm: true
  seq_modeling: true
  mu: 0.25
  quant_loss_weight: 1
  quantizer_dropout: 0.0
training:
  lr: 0.001
  l2: 1.0e-07
  batch_size: 512
  optim: adam
  max_epochs: 20
  early_stop_patience: 5
selection: {}
pretraining:
  lr: 0.001
  l2: 1.0e-07
  batch_size: 512
  optim: adam
  max_epochs: 20
  early_stop_patience: 5
